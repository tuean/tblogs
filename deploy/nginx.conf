# tblogs — reverse proxy with TLS and login rate limiting.
#
# Install (Debian/Ubuntu):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/tblogs
#   sudo ln -sf /etc/nginx/sites-available/tblogs /etc/nginx/sites-enabled/tblogs
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d blog.example.com
#
# Replace every occurrence of blog.example.com before use, and keep
# TBLOGS_BIND on 127.0.0.1 so the app is only reachable through this proxy.

# Shared bucket for login attempts: 5 per minute per client IP.
limit_req_zone $binary_remote_addr zone=tblogs_login:10m rate=5r/m;

server {
    listen      80;
    listen      [::]:80;
    server_name blog.example.com;

    # Leave the ACME challenge reachable so certbot can renew.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name blog.example.com;

    ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;

    gzip            on;
    gzip_types      text/css application/xml application/rss+xml text/plain;
    gzip_min_length 512;

    # Inherited by every location below.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Throttle credential guessing. Without this the shared admin token can be
    # brute forced at full line speed.
    location = /admin/login {
        limit_req zone=tblogs_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    # Optional: keep the entire admin surface off the public internet.
    # Uncomment, set your own network, and delete the rate-limited block above.
    # location /admin {
    #     allow 203.0.113.0/24;
    #     deny  all;
    #     proxy_pass http://127.0.0.1:8080;
    # }

    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}

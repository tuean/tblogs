{% extends "base.html" %}

{% block title %}{% if is_new %}新建文章{% else %}编辑文章{% endif %} · {{ site_title }}{% endblock %}

{% block content %}
<h1>{% if is_new %}新建文章{% else %}编辑文章{% endif %}</h1>

{% if !error.is_empty() %}
<div class="notice notice-error">{{ error }}</div>
{% endif %}

<form method="post" action="{{ action }}">
  <div class="field">
    <label for="title">标题</label>
    <input type="text" id="title" name="title" value="{{ form.title }}" required autofocus>
  </div>

  <div class="row">
    <div class="field">
      <label for="slug">Slug（留空则由标题生成）</label>
      <input type="text" id="slug" name="slug" value="{{ form.slug }}">
    </div>
    <div class="field">
      <label for="status">状态</label>
      <select id="status" name="status">
        <option value="draft"{% if !form.published %} selected{% endif %}>草稿</option>
        <option value="published"{% if form.published %} selected{% endif %}>发布</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label for="tags">标签（用逗号分隔）</label>
    <input type="text" id="tags" name="tags" value="{{ form.tags }}">
  </div>

  <div class="field">
    <label for="summary">摘要（留空则自动截取正文）</label>
    <input type="text" id="summary" name="summary" value="{{ form.summary }}">
  </div>

  <div class="field">
    <label for="body_md">正文（Markdown）</label>
    <textarea id="body_md" name="body_md">{{ form.body_md }}</textarea>
  </div>

  <div class="btn-row">
    <button class="btn" type="submit">保存</button>
    <a class="btn btn-secondary" href="/admin">取消</a>
  </div>
</form>
{% endblock %}

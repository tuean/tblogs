{% extends "base.html" %}

{% block title %}登录 · {{ site_title }}{% endblock %}

{% block content %}
<h1>管理登录</h1>

{% if !error.is_empty() %}
<div class="notice notice-error">{{ error }}</div>
{% endif %}

<form method="post" action="/admin/login" class="narrow">
  <div class="field">
    <label for="token">管理令牌</label>
    <input type="password" id="token" name="token" autofocus autocomplete="current-password">
  </div>
  <button class="btn" type="submit">登录</button>
</form>
{% endblock %}
